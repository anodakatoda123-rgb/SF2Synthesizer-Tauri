[package]
name = "sf2-synthesizer"
version = "0.1.0"
edition = "2021"
rust-version = "1.56"

[build-dependencies]
tauri-build = { version = "1.6", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
tauri = { version = "1.6", features = ["shell-open"] }
tokio = { version = "1", features = ["full"] }
cpal = { version = "0.17", features = ["asio"] }
rubato = "0.14"
parking_lot = "0.12"
ringbuf = "0.2"
once_cell = "1.19"
smallvec = "1.11"
thiserror = "1.0"
anyhow = "1.0"
log = "0.4"
env_logger = "0.11"
midir = "0.9"
thread-id = "4.1"
num_cpus = "1.16"
winapi = { version = "0.3", features = ["waveform"] }

[[lib]]
name = "sf2_synthesizer_lib"
path = "src/lib.rs"

[[bin]]
name = "sf2-synthesizer"
path = "src/main.rs"
